name: engine

on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # Known vulnerabilities in the engine's dependencies (RustSec). Also
    # runs weekly from engine-nightly, so a new advisory is seen without a push.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit@0.23.0
      - name: Audit
        run: cargo audit --deny warnings

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Second drive for the drive-quarantine test
        working-directory: ${{ runner.temp }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            hdiutil create -size 50m -fs APFS -volname ACTest drive.dmg -quiet
            hdiutil attach drive.dmg -nobrowse -mountpoint "$RUNNER_TEMP/drive"
            echo "OPENSWEEP_TEST_VOLUME=$RUNNER_TEMP/drive" >> "$GITHUB_ENV"
          else
            echo "OPENSWEEP_TEST_VOLUME=/dev/shm" >> "$GITHUB_ENV"
          fi
      - name: Test
        run: cargo test --locked
      - name: Validate bundled rules
        run: cargo run --locked -q -p opensweep-cli -- rules-check rules
