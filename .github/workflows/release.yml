name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Build provenance (N7): a signed statement of which workflow built the DMG.
  id-token: write
  attestations: write

# Secrets and variables are listed in docs/RELEASING.md. Without the Developer
# ID secrets this publishes an ad-hoc signed build marked as a pre-release.
jobs:
  dmg:
    name: Build, sign, notarize and publish
    runs-on: macos-26
    env:
      VERSION: ${{ github.ref_name }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_PRIVATE_KEY != '' && vars.SPARKLE_PUBLIC_KEY != '' }}
      HAS_TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Check the tag
        run: |
          V="${VERSION#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::tag $VERSION is not vX.Y.Z"; exit 1; }

      - name: Rust targets for a universal engine
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Engine checks
        working-directory: engine
        run: |
          cargo test --locked -q
          cargo run -q --locked -p agentclean-cli -- rules-check rules

      - name: No Swift file removal (ADR 0002)
        run: scripts/check-swift-never-deletes.sh

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          PASS=$(uuidgen)
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          # Hardened runtime only with a real identity: it makes macOS refuse to
          # load an ad-hoc signed Sparkle.framework, and only notarization needs it.
          if [ "$HAS_CERT" = true ]; then
            ID="$SIGN_IDENTITY"; TEAM="$TEAM_ID"; HARDENED=YES; FLAGS="--timestamp --options runtime"
          else
            ID=-; TEAM=""; HARDENED=NO; FLAGS=""
          fi
          xcodebuild -project AgentClean.xcodeproj -scheme AgentClean -configuration Release \
            -derivedDataPath build/dd build CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$ID" DEVELOPMENT_TEAM="$TEAM" \
            ENABLE_HARDENED_RUNTIME="$HARDENED" OTHER_CODE_SIGN_FLAGS="$FLAGS" \
            MARKETING_VERSION="${VERSION#v}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY"

      - name: Check the bundle
        run: |
          APP=build/dd/Build/Products/Release/AgentClean.app
          lipo -archs "$APP/Contents/Helpers/agentclean" | grep -q "x86_64 arm64"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "${VERSION#v}"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # It must start: a library macOS refuses to load ends it at once.
          "$APP/Contents/MacOS/AgentClean" & pid=$!; sleep 5; kill -0 $pid; kill $pid
          if [ "$HAS_CERT" = true ]; then
            codesign -dv "$APP" 2>&1 | grep -q "flags=.*runtime"
            codesign -dv "$APP/Contents/Helpers/agentclean" 2>&1 | grep -q "flags=.*runtime"
            codesign -dv "$APP/Contents/Helpers/agentclean" 2>&1 | grep -q "Timestamp="
          fi

      - name: Package DMG
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          V="${VERSION#v}"
          mkdir -p dist/root
          cp -R build/dd/Build/Products/Release/AgentClean.app dist/root/
          ln -s /Applications dist/root/Applications
          hdiutil create -volname "AgentClean $V" -srcfolder dist/root -ov -format UDZO "dist/AgentClean-$V.dmg"
          if [ "$HAS_CERT" = true ]; then
            codesign --sign "$SIGN_IDENTITY" --timestamp "dist/AgentClean-$V.dmg"
          fi

      - name: Notarize and staple
        if: env.HAS_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          V="${VERSION#v}"
          xcrun notarytool submit "dist/AgentClean-$V.dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "dist/AgentClean-$V.dmg"
          spctl --assess --type open --context context:primary-signature -v "dist/AgentClean-$V.dmg"

      - name: Checksum
        run: cd dist && V="${VERSION#v}" && shasum -a 256 "AgentClean-$V.dmg" > "AgentClean-$V.dmg.sha256"

      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/AgentClean-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/AgentClean-*.dmg

      - name: Sparkle appcast
        if: env.HAS_SPARKLE == 'true' && env.HAS_CERT == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          V="${VERSION#v}"
          mkdir -p updates && cp "dist/AgentClean-$V.dmg" updates/
          echo "$SPARKLE_PRIVATE_KEY" | build/dd/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$VERSION/" \
            -o dist/appcast.xml updates

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ env.HAS_CERT != 'true' || contains(github.ref_name, '-') }}
          files: |
            dist/AgentClean-*.dmg
            dist/AgentClean-*.dmg.sha256
            dist/AgentClean-sbom.spdx.json
            dist/appcast.xml
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            ## Install
            ```bash
            brew install --cask finjineersdev/tap/agentclean
            ```
            or download the `.dmg` below and drag **AgentClean** to Applications.
            The cask also puts the `agentclean` command on your PATH.

            Requires macOS 14 or later. No Full Disk Access needed; nothing leaves your Mac
            except the update check, which asks first.

      - name: Bump Homebrew cask
        if: env.HAS_TAP_TOKEN == 'true' && env.HAS_CERT == 'true' && !contains(github.ref_name, '-')
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          V="${VERSION#v}"
          SHA=$(awk '{print $1}' "dist/AgentClean-$V.dmg.sha256")
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Finjineersdev/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -E "s/^  version \".*\"/  version \"$V\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            packaging/homebrew/agentclean.rb | grep -v '^# ' > tap/Casks/agentclean.rb
          cd tap
          git config user.name "agentclean-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Casks/agentclean.rb
          git commit -m "agentclean $V" && git push
