schema = 2
id = "node"
name = "Node.js"

[detect]
any_files = ["package.json"]

[[artifact]]
path = "node_modules"
class = "caution"
reason = "Installed dependencies. Reinstall from the lockfile."
restore = "npm install (or pnpm install / yarn install)"

[[artifact]]
path = ".next"
class = "safe"
reason = "Next.js build output. Recreated by the next build or dev run."
restore = "next build"

[[artifact]]
path = ".turbo"
class = "safe"
reason = "Turborepo local task cache."
restore = "Recreated on the next turbo run"

[[artifact]]
path = ".nuxt"
class = "safe"
reason = "Nuxt build and dev output. Recreated by the next build or dev run."
restore = "nuxt build"

[[artifact]]
path = ".parcel-cache"
class = "safe"
reason = "Parcel build cache."
restore = "Recreated on the next parcel build"

[[artifact]]
path = ".svelte-kit"
class = "safe"
reason = "SvelteKit generated files and build output."
restore = "Recreated by vite dev or vite build"

[[artifact]]
path = ".angular/cache"
class = "safe"
reason = "Angular CLI build cache."
restore = "Recreated on the next ng build"

[[artifact]]
path = "dist"
class = "safe"
reason = "Build output from Vite or webpack, whose default output folder is dist."
restore = "npm run build"
requires = { any_glob = ["vite.config.*", "webpack.config.*"] }

[[artifact]]
path = "build"
class = "safe"
reason = "Create React App build output."
restore = "npm run build"
requires = { json = { file = "package.json", key = "dependencies.react-scripts" } }
