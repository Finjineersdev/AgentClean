schema = 2
id = "python"
name = "Python"

[detect]
any_files = ["pyproject.toml", "requirements.txt", "setup.py"]

[[artifact]]
path = ".venv"
class = "caution"
reason = "Virtual environment. Recreate it and reinstall dependencies."
restore = "python -m venv .venv, then install dependencies"

[[artifact]]
path = ".pytest_cache"
class = "safe"
reason = "pytest cache. Recreated on the next test run."
restore = "Recreated automatically"

[[artifact]]
path = ".ruff_cache"
class = "safe"
reason = "Ruff lint cache. Recreated on the next lint run."
restore = "Recreated automatically"
