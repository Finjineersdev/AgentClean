[workspace]
resolver = "2"
members = ["crates/agentclean-core", "crates/agentclean-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/AGENTCLEAN_OWNER/AgentClean"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
proptest = "1"
tempfile = "3"
